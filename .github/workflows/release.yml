name: Package and Release Addon

on:
  push:
    tags:
      - '*' # Triggers on any tag (e.g., 0.1, v0.1, 1.0.0)

# Grant permission to create Releases and attach files
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Packages your addon into a .zip (e.g., ModernMapMarkers-0.1.zip)
      - name: Package Addon
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Uploads the generated .zip directly to your GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          body_path: CHANGELOG.md # Uses the changelog auto-generated by BigWigs Packager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
