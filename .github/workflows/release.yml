name: Package and Release Addon

on:
  push:
    tags:
      - 'v*'
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and Publish Addon
        uses: BigWigsMods/packager@v2
        env:
          # Optional publishing tokens (Add secrets in your repo Settings -> Secrets and variables -> Actions):
          CF_API_KEY: ${{ secrets.CF_API_KEY }}         # CurseForge
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}   # WoWInterface
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}   # Wago Addons
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       # Creates GitHub Release automatically
